# ينشر نسخة الويب من MOJAN على GitHub Pages تلقائياً مع كل رفع على main.
name: Deploy MOJAN web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter test
      # بدون tree-shake للأيقونات حتى لا تختفي، وبدون CDN حتى يعمل كل شيء من نفس الموقع
      - run: flutter build web --release --no-web-resources-cdn --no-tree-shake-icons
      - name: Relative base href (works on any repo name)
        run: |
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html
          sed -i 's|<title>[^<]*</title>|<title>MOJAN</title>|' build/web/index.html
          cp build/web/index.html build/web/404.html
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      # يحدّث فرع gh-pages الذي تُعرض منه الصفحة
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
