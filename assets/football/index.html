<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOJAN كرة القدم</title>
<style>
@font-face { font-family: Cairo; src: url('../fonts/Cairo.ttf'); font-weight: 200 1000; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #070b18; font-family: Cairo, system-ui, sans-serif; color: #fff; touch-action: none; overscroll-behavior: none; }
body.clean .hud, body.clean #controls, body.clean .topbtn { display: none !important; }
#app { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
#c { position: absolute; inset: 0; display: block; }
.hud { position: absolute; pointer-events: none; }
/* لوحة النتيجة */
#score { top: max(10px, env(safe-area-inset-top)); left: 14px; direction: ltr; display: flex; align-items: stretch; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.45); font-weight: 900; }
#score .tm { display: flex; align-items: center; gap: 6px; background: rgba(10,14,30,.88); padding: 4px 10px; font-size: 14px; }
#score .tm img { width: 26px; height: 26px; object-fit: contain; }
#score .kit { width: 6px; align-self: stretch; }
#score .sc { background: linear-gradient(#ffe36e, #ffb21a); color: #1a1200; padding: 2px 12px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
#score .ck { background: #0e1630; color: #9fe8ff; padding: 2px 10px; font-size: 15px; display: flex; align-items: center; font-variant-numeric: tabular-nums; }
#score.pop .sc { animation: pop .6s; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
.topbtn { position: absolute; top: max(10px, env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 12px; background: rgba(10,14,30,.75); border: 1px solid rgba(255,255,255,.15); display: grid; place-items: center; font-size: 18px; pointer-events: auto; cursor: pointer; }
#pause { right: 14px; }
#cam { right: 62px; }
/* اللافتات */
#banner { left: 0; right: 0; top: 30%; text-align: center; opacity: 0; transform: scale(.7); transition: all .35s cubic-bezier(.2,1.6,.4,1); }
#banner.show { opacity: 1; transform: scale(1); }
#bt { font-size: 44px; font-weight: 1000; text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,210,60,.6); }
#banner.big #bt { font-size: 86px; background: linear-gradient(#fff6b0, #ffb21a 60%, #ff7a1a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(80,30,0,.6)); animation: shake .5s; }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.1); } 75% { transform: rotate(4deg); } }
#bs { margin-top: 4px; display: inline-block; padding: 4px 16px; border-radius: 30px; background: rgba(0,0,0,.55); font-weight: 800; font-size: 16px; }
#bs:empty { display: none; }
#toast { top: 60px; left: 50%; transform: translateX(-50%) translateY(-10px); background: rgba(10,14,30,.82); padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 14px; opacity: 0; transition: all .25s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#hint { bottom: 22px; left: 50%; transform: translateX(-50%); background: rgba(255,210,60,.92); color: #231a00; padding: 6px 16px; border-radius: 20px; font-weight: 900; font-size: 14px; opacity: 0; transition: opacity .2s; animation: pulse 1s infinite; }
#hint.show { opacity: 1; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
#who { bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: #ffe14d; text-shadow: 0 1px 3px #000; }
#power { bottom: 150px; right: 40px; width: 150px; height: 12px; border-radius: 8px; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.7); overflow: hidden; opacity: 0; }
#power.show { opacity: 1; }
#pfill { height: 100%; width: 0; direction: ltr; }
/* التحكم */
#controls { position: absolute; inset: 0; pointer-events: none; }
#joyzone { position: absolute; left: 0; top: 70px; bottom: 0; width: 46%; pointer-events: auto; touch-action: none; }
#joy { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.08), rgba(255,255,255,.18)); border: 2px solid rgba(255,255,255,.35); left: 110px; top: calc(100% - 120px); opacity: .55; transition: opacity .15s; pointer-events: none; }
#joy.on { opacity: 1; }
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9c6e0); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.btn { position: absolute; border-radius: 50%; display: grid; place-items: center; font-weight: 1000; pointer-events: auto; touch-action: none; box-shadow: 0 6px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.4); transition: transform .06s; cursor: pointer; }
.btn.on { transform: scale(.9); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn span { font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#btnB { right: calc(24px + env(safe-area-inset-right)); bottom: 34px; width: 92px; height: 92px; background: radial-gradient(circle at 35% 30%, #ff8a8a, #e0242f); }
#btnA { right: calc(126px + env(safe-area-inset-right)); bottom: 22px; width: 76px; height: 76px; background: radial-gradient(circle at 35% 30%, #8affc8, #13a868); }
#btnS { right: calc(40px + env(safe-area-inset-right)); bottom: 138px; width: 62px; height: 62px; background: radial-gradient(circle at 35% 30%, #9cd2ff, #2f6fe0); }
#btnS span { font-size: 12px; }
/* لوحات */
.panel { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,8,20,.7); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.panel.show { opacity: 1; pointer-events: auto; }
.card { background: linear-gradient(160deg, #1b2450, #0d1230); border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 18px 26px; min-width: 320px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.card h2 { margin: 0 0 10px; font-size: 26px; }
.pbtn { display: block; width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 14px; font: 900 17px Cairo, sans-serif; color: #fff; background: linear-gradient(#5cf2b5, #13a868); cursor: pointer; }
.pbtn.red { background: linear-gradient(#ff8a8a, #c9183a); }
.final { display: flex; align-items: center; justify-content: center; gap: 16px; direction: ltr; margin: 4px 0 8px; }
.final img { width: 54px; height: 54px; object-fit: contain; }
.final .n { font-size: 13px; font-weight: 800; }
.final .s { font-size: 46px; font-weight: 1000; }
#egoals { display: flex; justify-content: space-between; direction: ltr; font-size: 12px; color: #c9d4ff; gap: 20px; margin-bottom: 6px; }
#estats .row { display: flex; justify-content: space-between; direction: ltr; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 14px; }
#estats .row span { color: #9fb0e0; font-weight: 700; }
/* المقدمة */
#intro { left: 0; right: 0; bottom: 18%; display: flex; justify-content: center; opacity: 0; transition: opacity .5s; }
#intro.show { opacity: 1; }
#intro .vs { display: flex; align-items: center; gap: 18px; background: rgba(8,12,30,.8); padding: 10px 26px; border-radius: 18px; direction: ltr; font-weight: 900; font-size: 22px; border: 1px solid rgba(255,255,255,.12); }
#intro img { width: 58px; height: 58px; object-fit: contain; }
#intro .x { color: #ffd23f; font-size: 26px; }
@media (max-height: 420px) {
  #btnB { width: 80px; height: 80px; bottom: 22px; }
  #btnA { width: 66px; height: 66px; bottom: 14px; right: calc(112px + env(safe-area-inset-right)); }
  #btnS { width: 54px; height: 54px; bottom: 116px; }
  #power { bottom: 124px; }
  .card { padding: 12px 20px; }
  .final .s { font-size: 36px; }
  #bt { font-size: 34px; }
  #banner.big #bt { font-size: 64px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="score" class="hud">
    <div class="kit" id="hk"></div>
    <div class="tm"><img id="hc" alt=""><span id="hn"></span></div>
    <div class="sc"><span id="hs">0</span><span>-</span><span id="as">0</span></div>
    <div class="tm"><span id="an"></span><img id="ac" alt=""></div>
    <div class="kit" id="ak"></div>
    <div class="ck" id="clock">00:00</div>
  </div>
  <div id="cam" class="topbtn" title="الكاميرا">🎥</div>
  <div id="pause" class="topbtn" title="إيقاف">⏸</div>
  <div id="banner" class="hud"><div id="bt"></div><div id="bs"></div></div>
  <div id="toast" class="hud"></div>
  <div id="intro" class="hud"><div class="vs"><img id="ihc" alt=""><span id="ihn"></span><span class="x">VS</span><span id="ian"></span><img id="iac" alt=""></div></div>
  <div id="controls">
    <div id="joyzone"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="btnS" class="btn"><span>سرعة</span></div>
    <div id="btnA" class="btn"><span id="la">تمرير</span></div>
    <div id="btnB" class="btn"><span id="lb">تسديد</span></div>
    <div id="power" class="hud"><div id="pfill"></div></div>
    <div id="hint" class="hud"></div>
    <div id="who" class="hud"></div>
  </div>
  <div id="pausePanel" class="panel"><div class="card">
    <h2>إيقاف مؤقت</h2>
    <div style="font-size:13px;color:#b8c4ee;line-height:1.7;margin-bottom:6px">
      العصا يسار الشاشة للحركة · <b>تمرير</b> (اضغط مطولاً لكرة عالية) · <b>تسديد</b> (اضغط مطولاً للقوة، وحرّك العصا للأعلى/الأسفل لاختيار الزاوية) · <b>سرعة</b> للجري<br>
      بدون كرة: <b>تبديل</b> اللاعب و<b>افتكاك</b> (مع السرعة = انزلاق)
    </div>
    <button class="pbtn" id="resume">متابعة</button>
    <button class="pbtn red" id="quit">انسحاب</button>
  </div></div>
  <div id="endPanel" class="panel"><div class="card">
    <h2 id="etitle"></h2>
    <div class="final">
      <div><img id="ehc" alt=""><div class="n" id="ehn"></div></div>
      <div class="s"><span id="eh"></span> - <span id="ea"></span></div>
      <div><img id="eac" alt=""><div class="n" id="ean"></div></div>
    </div>
    <div id="egoals"></div>
    <div id="estats"></div>
    <button class="pbtn" id="done">متابعة</button>
  </div></div>
</div>
